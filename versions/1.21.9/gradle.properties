# Per-node (Minecraft 1.21.9 / NeoForge) dependency versions. Read by build.gradle for this node.
minecraft_version=1.21.9
minecraft_version_range=[1.21.9,1.21.10)
# NeoForge never cut a stable for 1.21.9 (superseded quickly by 1.21.10) — latest beta.
neo_version=21.9.16-beta
neo_version_range=[21.9,)
# JEI for 1.21.9 is the 25.x family.
# PINNED, not a range: a dynamic `25.+` silently re-resolves and can pick a JEI that
# requires a newer neoforge than neo_version above, breaking runGameTestServer with no
# commit to blame. Bump this deliberately, checking the new jar's neoforge dependency.
jei_version=25.0.1.4
