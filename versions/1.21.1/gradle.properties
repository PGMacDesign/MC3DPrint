# Per-node (Minecraft 1.21.1 / NeoForge) dependency versions. Read by build.gradle for this node.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.248
neo_version_range=[21.1,)
# JEI for 1.21.1 is the 19.x family.
# PINNED, not a range: a dynamic `19.+` silently re-resolves and can pick a JEI that
# requires a newer neoforge than neo_version above, breaking runGameTestServer with no
# commit to blame. Bump this deliberately, checking the new jar's neoforge dependency.
jei_version=19.39.0.371
ae2_version=19.2.17
# GuideME is AE2's in-game guide, split out of the AE2 jar and declared by AE2 as a REQUIRED
# dependency. Compiling never needs it, but AE2 refuses to load without it, so the dev runtime
# does. Bump alongside ae2_version.
guideme_version=21.1.17
