# Per-node (Minecraft 1.21.8 / NeoForge) dependency versions. Read by build.gradle for this node.
minecraft_version=1.21.8
minecraft_version_range=[1.21.8,1.21.9)
neo_version=21.8.53
neo_version_range=[21.8,)
# JEI for 1.21.8 is the 24.x family (was 19.x on 1.21.1).
# PINNED, not a range: a dynamic `24.+` silently re-resolves and can pick a JEI that
# requires a newer neoforge than neo_version above, breaking runGameTestServer with no
# commit to blame. Bump this deliberately, checking the new jar's neoforge dependency.
jei_version=24.2.0.6
