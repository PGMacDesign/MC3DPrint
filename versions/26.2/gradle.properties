# Per-node (Minecraft 26.2 / NeoForge) dependency versions. Read by build.gradle for this node.
# NeoForge for 26.2 is beta-only so far (no stable cut yet) — track the latest beta.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.16-beta
neo_version_range=[26.2,)
# JEI for 26.2 is the 30.x family.
# PINNED, not a range: a dynamic `30.+` silently re-resolves and can pick a JEI that
# requires a newer neoforge than neo_version above, breaking runGameTestServer with no
# commit to blame. Bump this deliberately, checking the new jar's neoforge dependency.
jei_version=30.14.0.89
