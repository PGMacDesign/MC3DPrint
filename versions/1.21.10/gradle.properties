# Per-node (Minecraft 1.21.10 / NeoForge) dependency versions. Read by build.gradle for this node.
minecraft_version=1.21.10
minecraft_version_range=[1.21.10,1.21.11)
neo_version=21.10.64
neo_version_range=[21.10,)
# JEI for 1.21.10 is the 26.x family.
# PINNED, not a range: a dynamic `26.+` silently re-resolves and can pick a JEI that
# requires a newer neoforge than neo_version above, breaking runGameTestServer with no
# commit to blame. Bump this deliberately, checking the new jar's neoforge dependency.
jei_version=26.3.0.31
