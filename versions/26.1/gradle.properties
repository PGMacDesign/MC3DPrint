# Per-node (Minecraft 26.1 / NeoForge) dependency versions. Read by build.gradle for this node.
# First node of the 2026 version scheme (26.x follows 1.21.11); NeoForge versions are 4-part here.
minecraft_version=26.1
minecraft_version_range=[26.1,26.2)
neo_version=26.1.2.77
# The floor is the build we compile against, NOT the 26.1 line's first build. NeoForge
# renamed BlockEvent.BreakEvent -> event.level.block.BreakBlockEvent partway through 26.1
# (absent in 26.1.2.20-beta, present from 26.1.2.21-beta), so a jar built here throws
# NoClassDefFoundError during mod construction on any earlier 26.1. The 26.x lines are still
# churning; only the build we compile against is provably complete, so that is the floor.
neo_version_range=[26.1.2.77,)
# JEI for 26.1 is the 29.x family; its artifact tracks the MC patch version (26.1.2).
# PINNED, not a range: a dynamic `29.+` silently re-resolves and can pick a JEI that
# requires a newer neoforge than neo_version above, breaking runGameTestServer with no
# commit to blame. Bump this deliberately, checking the new jar's neoforge dependency.
jei_version=29.19.0.51
jei_mc_version=26.1.2
