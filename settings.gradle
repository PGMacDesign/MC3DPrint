pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'KikuGie'
            url = 'https://maven.kikugie.dev/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.6'
}

stonecutter {
    // Stonecutter defaults to Kotlin; this project is Groovy.
    kotlinController = false
    centralScript = 'build.gradle'

    // The version axis (NeoForge only). 1.21.1 = base/control node (= current main);
    // 1.21.8 = first forward target (crosses the 1.21.2 render/ingredient/component breaks).
    create(rootProject) {
        versions '1.21.1', '1.21.8', '1.21.9'
        vcsVersion = '1.21.1'
    }
}
