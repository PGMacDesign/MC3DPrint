<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MC3DPrint">
  <defs>
    <radialGradient id="bg" cx="42%" cy="34%" r="80%">
      <stop offset="0" stop-color="#1b2430"/><stop offset="1" stop-color="#0e121a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bfe9ff"/><stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc873"/><stop offset="1" stop-color="#f4a23c"/>
    </linearGradient>
  </defs>

  <!-- dark badge backdrop -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2c3342" stroke-width="3"/>
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="2"/>

  <!-- 5B print-bed scene, centered (orig 256-space point (128,125) → badge center, scale 1.78) -->
  <g transform="translate(256,262) scale(1.78) translate(-128,-125)">
    <!-- rails + gantry -->
    <rect x="44" y="38" width="10" height="150" rx="2" fill="#3c4148"/>
    <rect x="202" y="38" width="10" height="150" rx="2" fill="#3c4148"/>
    <rect x="40" y="56" width="176" height="12" rx="3" fill="#5a6068"/>
    <rect x="116" y="60" width="24" height="16" rx="2" fill="#9aa3ad"/>
    <path d="M122,76 L134,76 L130,90 L126,90 Z" fill="#6e767f"/>
    <!-- filament feed to the active layer -->
    <line x1="128" y1="90" x2="128" y2="130" stroke="#f4a23c" stroke-width="3"/>
    <!-- bed -->
    <polygon points="56,216 200,216 176,182 80,182" fill="#272b30" stroke="#5a6068" stroke-width="2"/>
    <!-- 2x2 grey base: back, right, left, front -->
    <g><path d="M104,158 L128,170 L128,196 L104,184 Z" fill="#9aa3ad"/><path d="M152,158 L128,170 L128,196 L152,184 Z" fill="#6e767f"/><path d="M128,146 L152,158 L128,170 L104,158 Z" fill="#cfd5dc"/></g>
    <g><path d="M128,170 L152,182 L152,208 L128,196 Z" fill="#9aa3ad"/><path d="M176,170 L152,182 L152,208 L176,196 Z" fill="#6e767f"/><path d="M152,158 L176,170 L152,182 L128,170 Z" fill="#cfd5dc"/></g>
    <g><path d="M80,170 L104,182 L104,208 L80,196 Z" fill="#9aa3ad"/><path d="M128,170 L104,182 L104,208 L128,196 Z" fill="#6e767f"/><path d="M104,158 L128,170 L104,182 L80,170 Z" fill="#cfd5dc"/></g>
    <g><path d="M104,182 L128,194 L128,220 L104,208 Z" fill="#9aa3ad"/><path d="M152,182 L128,194 L128,220 L152,208 Z" fill="#6e767f"/><path d="M128,170 L152,182 L128,194 L104,182 Z" fill="#cfd5dc"/></g>
    <!-- amber top block (printing) -->
    <g><path d="M104,146 L128,158 L128,184 L104,172 Z" fill="#f4a23c"/><path d="M152,146 L128,158 L128,184 L152,172 Z" fill="#d9852c"/><path d="M128,134 L152,146 L128,158 L104,146 Z" fill="url(#amberTop)"/></g>
    <path d="M128,134 L152,146 L128,158 L104,146 Z" fill="none" stroke="#ffe0a8" stroke-width="1.2" stroke-opacity="0.8"/>
    <ellipse cx="128" cy="134" rx="26" ry="10" fill="url(#glow)"/>
  </g>
</svg>
