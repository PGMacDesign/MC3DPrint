language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  # Without this, CodeRabbit only accepts PRs targeting the default branch and answers
  # "reviews are disabled for this base branch" to everything else, including an explicit
  # @coderabbitai review. Every fix ships as a main + legacy pair, so the legacy half was
  # silently unreviewable. Regex, so the dots are escaped.
  base_branches:
    - "main"
    - "legacy/1\\.20\\.1"
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true
  # Disable all walkthrough components
  changed_files_summary: false
  sequence_diagrams: true
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  commit_status: false
  tools:
    github-checks:
      enabled: false
  auto_review:
    enabled: false
    drafts: false
    labels:
      - "needs-ai-review"
chat:
  auto_reply: true