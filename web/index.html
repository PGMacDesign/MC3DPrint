<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MC3DPrint — Blueprint Viewer</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <aside id="panel">
    <h1>MC3DPrint<span>Blueprint Viewer</span></h1>

    <div class="group">
      <label class="filebtn">Open .blueprint…<input id="file" type="file" accept=".blueprint" hidden></label>
      <p class="hint">…or drag a file anywhere on the page.</p>
    </div>

    <div class="group">
      <div class="row">
        <input id="url" type="text" placeholder="path or URL to a .blueprint">
        <button id="loadUrl">Load</button>
      </div>
    </div>

    <div class="group" id="galleryGroup" hidden>
      <input id="search" type="text" placeholder="Search curated builds…">
      <div id="gallery"></div>
    </div>

    <div class="group">
      <label class="check"><input id="ghost" type="checkbox" checked> Ghost (translucent)</label>
      <label class="slider">Layer <span id="layerVal">–</span>
        <input id="layer" type="range" min="1" max="1" value="1">
      </label>
    </div>

    <div id="info"></div>
    <div id="status"></div>
  </aside>

  <canvas id="canvas"></canvas>
  <script type="module" src="js/app.js"></script>
</body>
</html>
