# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# REQUIRED: Stonecutter (this multi-version build) needs Gradle's OWN JVM to be Java 21+
# (Gradle 9.6.1 + Stonecutter 0.9.6). ModDevGradle only needed 21 for the toolchain; Stonecutter
# needs it for the launcher. Install a JDK 21 and either set JAVA_HOME or uncomment org.gradle.java.home
# below with your JDK 21 path. (macOS: `brew install openjdk@21` then symlink into
# /Library/Java/JavaVirtualMachines, or point org.gradle.java.home at the foojay-provisioned JDK under
# ~/.gradle/jdks/.) Without a 21 launcher JVM, `./gradlew` fails with "Stonecutter requires ... Java 21".
# org.gradle.java.home=/path/to/jdk-21


## Environment Properties

# The Minecraft version. NeoForge 21.1.x targets 1.21.1.
minecraft_version=1.21.1
# Range: current 1.21.1 up to but not including 1.21.2 (mods are version-locked).
minecraft_version_range=[1.21.1,1.21.2)
# The NeoForge version. Pin a current 1.21.1 build; bump as needed during the port.
neo_version=21.1.92
# NeoForge version range.
neo_version_range=[21.1,)
# The FML loader version range (NeoForge uses major 4 on 1.21.x, not Forge's 47).
loader_version_range=[4,)

## Integration dependency versions
# JEI for 1.21.1 is the 19.x family on the neoforge artifact (was 15.x / forge on 1.20.1).
jei_version=19.+


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=mc3dprint
# The human-readable display name for the mod.
mod_name=MC3DPrint
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=0.10.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
mod_group_id=com.pgmacdesign.mc3dprint
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=PGMacDesign
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Tiered 3D printing machines: scan structures, save blueprints, print anywhere.\nWorldEdit for survival mode players.
