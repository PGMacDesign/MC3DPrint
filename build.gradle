import org.gradle.api.tasks.PathSensitivity
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.+'
}

version = mod_version
group = mod_group_id

stonecutter {
    // 1.21.11 renamed/moved several classes wholesale. Global token replacements keep the
    // shared source in the canonical (pre-rename) vocabulary; Stonecutter rewrites per node.
    // Each pair is idempotent (the result never re-contains the source token) and reverses
    // uniquely (the canonical tree never legitimately contains the target token).
    replacements.string(current.parsed.matches('>=1.21.11')) {
        replace 'ResourceLocation', 'Identifier'
        replace 'net.minecraft.world.entity.vehicle.Boat', 'net.minecraft.world.entity.vehicle.boat.Boat'
        // RenderType static factories moved to RenderTypes (the RenderType import itself is a
        // per-file guard — an import-path replacement would substring-collide with these).
        replace 'RenderType.lines(', 'RenderTypes.lines('
        replace 'RenderType.entitySolid(', 'RenderTypes.entitySolid('
        replace 'RenderType.eyes(', 'RenderTypes.eyes('
        replace 'RenderType.translucentMovingBlock(', 'RenderTypes.translucentMovingBlock('
    }
    // MC 26.1 (first of the 2026 scheme): the GUI pipeline's GuiGraphics became
    // GuiGraphicsExtractor, and several utilities moved/renamed. Same invertibility
    // rules as above (the ';' / ' ' / '(' anchors keep every pair collision-free).
    replacements.string(current.parsed.matches('>=26.1')) {
        replace 'GuiGraphics;', 'GuiGraphicsExtractor;'
        replace 'GuiGraphics ', 'GuiGraphicsExtractor '
        replace 'net.minecraft.client.renderer.state.CameraRenderState', 'net.minecraft.client.renderer.state.level.CameraRenderState'
        replace 'import net.minecraft.client.renderer.LightTexture;', 'import net.minecraft.util.LightCoordsUtil;'
        replace 'LightTexture.FULL_BRIGHT', 'LightCoordsUtil.FULL_BRIGHT'
        replace 'FarmBlock', 'FarmlandBlock'
    }
    // MC 26.2: advancement criteria split into triggers/ + predicates/ subpackages,
    // the EntityType spawn-egg-style constants moved to an EntityTypes holder, and the
    // light sampler moved onto LightCoordsUtil.
    // NOTE: version-RANGE conditions ('>=A <B' or composed booleans) do not reliably fire
    // for replacement groups on this Stonecutter — anything that moves TWICE across nodes
    // (criteria packages, the light sampler) is handled with in-file guard chains instead.
    replacements.string(current.parsed.matches('>=26.2')) {
        replace 'EntityType.ARMOR_STAND', 'net.minecraft.world.entity.EntityTypes.ARMOR_STAND'
        replace 'EntityType.ITEM_FRAME', 'net.minecraft.world.entity.EntityTypes.ITEM_FRAME'
        replace 'EntityType.GLOW_ITEM_FRAME', 'net.minecraft.world.entity.EntityTypes.GLOW_ITEM_FRAME'
        replace 'EntityType.PAINTING', 'net.minecraft.world.entity.EntityTypes.PAINTING'
        replace 'EntityType.MINECART', 'net.minecraft.world.entity.EntityTypes.MINECART'
    }
}

base {
    archivesName = mod_id
}

// 1.21.x ships on Java 21; the 26.x line (2026 version scheme) bumped to Java 25.
// The toolchain provisions the right JDK per node for compile + the NeoForge run
// tasks (foojay resolver is wired in settings.gradle); the Gradle daemon stays on 21.
def nodeJavaVersion = ['26.1': 25, '26.2': 25].getOrDefault(stonecutter.current.project, 21)
java.toolchain.languageVersion = JavaLanguageVersion.of(nodeJavaVersion)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neo_version

    // ModDevGradle wires the modding deps into `main` only; the JUnit suite in
    // src/test needs Minecraft/NeoForge on its compile + runtime classpath too.
    addModdingDependenciesTo sourceSets.test

    // NB: the namespace property is `neoforge.enabledGameTestNamespaces` (was `forge.…`).
    // It must be set on client, server AND gameTestServer — if it's unset, ZERO gametests
    // register and `runGameTestServer` exits 0 having run nothing (a false green).
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Launches the dedicated GameTestServer, runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'BlameJared (JEI, Patchouli)'
        url = 'https://maven.blamejared.com/'
    }
    // AE2 publishes nothing newer than 19.2.0-beta to modmaven, and nothing at all for the
    // 26.x line, so its jars come from Modrinth's maven mirror instead. Scoped to that one
    // group so an unrelated dependency can never silently resolve from here.
    maven {
        name = 'Modrinth (Applied Energistics 2)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // JEI: API at compile time, full mod at dev runtime. Both the version family (15.x -> 19.x)
    // and the artifact id (forge -> neoforge) change vs the 1.20.1 build.
    // From MC 26.x JEI's artifact tracks the PATCH version (jei-26.1.2-…) while the node id is
    // the minor (26.1) — jei_mc_version overrides the coordinate where they diverge.
    def jeiMc = findProperty('jei_mc_version') ?: minecraft_version
    compileOnly "mezz.jei:jei-${jeiMc}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jeiMc}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jeiMc}-neoforge:${jei_version}"

    // Applied Energistics 2, on the nodes where it exists at all. AE2 skipped the entire
    // 1.21.2-1.21.11 range (its releases go 1.21.1 straight to 26.1), so `ae2_version` is
    // declared only by the nodes that can have it and everything below is inert elsewhere.
    // compileOnly, not implementation: nothing here may become a hard runtime requirement.
    if (findProperty('ae2_version')) {
        compileOnly "maven.modrinth:ae2:${ae2_version}"
        // On the dev runtime too, so the integration can actually be gametested rather than
        // only compiled. This needs the node's neo_version to satisfy AE2 (19.2.17 wants
        // NeoForge 21.1.169+) and GuideME alongside it, which AE2 split out of its own jar and
        // declares as required: without it AE2 aborts mod loading and takes every unrelated
        // gametest with it. runtimeOnly, never implementation, so none of this can become a
        // hard requirement of the shipped jar.
        runtimeOnly "maven.modrinth:ae2:${ae2_version}"
        runtimeOnly "maven.modrinth:guideme:${guideme_version}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// AE2-only sources live apart from the shared tree rather than behind Stonecutter guards:
// the guards comment out a region, but a file that imports appeng.* cannot even be parsed on a
// node with no AE2 on the classpath. Adding the directory only where the dependency exists keeps
// those nodes from ever seeing the source. The code inside self-registers on the mod bus, so the
// always-present core never names a class that may not be there.
if (findProperty('ae2_version')) {
    sourceSets.main.java.srcDir 'src/ae2/java'
    sourceSets.main.resources.srcDir 'src/ae2/resources'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // ReleaseTargetsTest reads these two off disk, and neither belongs to a source set, so
    // Gradle would call the whole task UP-TO-DATE after a change to either and quietly skip the
    // check that exists to catch exactly that change. Declared as inputs so editing the workflow
    // or the node list re-runs the suite.
    inputs.file(rootProject.file('.github/workflows/release.yml'))
            .withPropertyName('releaseWorkflow')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('scripts/build-all.sh'))
            .withPropertyName('buildAllScript')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // NodeLoaderRangeTest reads every node's declared NeoForge floor. Without these declared,
    // Gradle calls :test UP-TO-DATE right after a gradle.properties edit and the guard no-ops.
    inputs.files(rootProject.fileTree('versions') { include '*/gradle.properties' })
            .withPropertyName('nodeGradleProperties')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // Under Stonecutter each version is a subproject, so the test task's default
    // working dir is versions/<node>/; the blueprint-audit tests read root-relative
    // paths (src/main/resources/...). Pin the working dir to the real project root.
    workingDir = rootProject.projectDir
    // Forward the opt-in flag for the curated-blueprint generator to the test JVM
    // (Gradle does not pass -D properties to the forked test JVM by default). A
    // normal build leaves it 'false', so the generator stays skipped.
    systemProperty 'genBlueprints', System.getProperty('genBlueprints', 'false')
    // Same opt-in plumbing for the blueprint dump/validation tool.
    systemProperty 'dumpBlueprints', System.getProperty('dumpBlueprints', 'false')
    // Same opt-in plumbing for the foundation/floating diagnostic audit.
    systemProperty 'auditFoundations', System.getProperty('auditFoundations', 'false')
    // Same opt-in plumbing for the ladder-support (unbacked-ladder) diagnostic audit.
    systemProperty 'auditLadders', System.getProperty('auditLadders', 'false')
    // Same opt-in plumbing for the plant-support (plant on invalid soil) diagnostic audit.
    systemProperty 'auditPlantSupport', System.getProperty('auditPlantSupport', 'false')
    // Same opt-in plumbing for the interior-reachability (no-entrance) diagnostic audit.
    systemProperty 'auditReachability', System.getProperty('auditReachability', 'false')
    // Same opt-in plumbing for the navigability (walkability / blocked-threshold) diagnostic audit.
    systemProperty 'auditNavigability', System.getProperty('auditNavigability', 'false')
    // Same opt-in plumbing for the bed-clearance (embedded-bed) diagnostic audit.
    systemProperty 'auditBeds', System.getProperty('auditBeds', 'false')
    // Same opt-in plumbing for the fire-hazard (lava/fire near flammable) diagnostic audit.
    systemProperty 'auditFireHazard', System.getProperty('auditFireHazard', 'false')
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// Expand declared replace properties into the mod metadata + pack.mcmeta at process time.
tasks.named('processResources', ProcessResources).configure {
    // pack.mcmeta pack_format is the DATA pack format of the target MC version (1.21.1=48,
    // 1.21.8=81, 1.21.9=88). Per-node so each jar declares the right value instead of a stale
    // hardcode. Source of truth: version.json ("pack_version".data_major) inside the MC client jar.
    def dataPackFormat = ['1.21.1': 48, '1.21.8': 81, '1.21.9': 88, '1.21.10': 88, '1.21.11': 94, '26.1': 101, '26.2': 107].getOrDefault(stonecutter.current.project, 48)
    // 1.21.9's pack schema requires explicit min_format/max_format once the format is >81;
    // older versions reject the unknown keys' absence gracefully but we keep them off there.
    def packFormatExtra = dataPackFormat > 81
            ? ",\n    \"min_format\": ${dataPackFormat},\n    \"max_format\": ${dataPackFormat}"
            : ''
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            pack_format: dataPackFormat,
            pack_format_extra: packFormatExtra,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // NeoForge 26.1 dropped the global_loot_modifiers.json index — every file under
    // data/<ns>/loot_modifiers/ now loads as a modifier directly (ordering via the new
    // per-modifier "priority" field). Shipping the old index there makes it parse as a
    // (malformed) modifier, so strip it from 26.1+ jars.
    if (stonecutter.current.parsed.matches('>=26.1')) {
        exclude 'data/neoforge/loot_modifiers/global_loot_modifiers.json'
    }

    // MC 1.21.2 changed the recipe-ingredient codec: the {"item":"x"} / {"tag":"x"} objects
    // became a bare id "x" / "#tag". The source recipe JSONs stay in the 1.21.1 form (which
    // 1.21.1 requires); for any forward node (>=1.21.2) rewrite them in the packaged output so
    // the same single source ships valid recipes per node. Idempotent — already-bare ids don't
    // match. Result objects ({"id":...}) and conditions are untouched (no "item"/"tag" key).
    if (stonecutter.current.project != '1.21.1') {
        doLast {
            def recipeDir = new File(sourceSets.main.output.resourcesDir, 'data/mc3dprint/recipe')
            if (recipeDir.exists()) {
                recipeDir.eachFileRecurse { f ->
                    if (!f.name.endsWith('.json')) return
                    def text = f.text
                    def out = text
                            .replaceAll(/\{\s*"item"\s*:\s*"([^"]+)"\s*\}/, '"$1"')
                            .replaceAll(/\{\s*"tag"\s*:\s*"([^"]+)"\s*\}/, '"#$1"')
                    if (out != text) f.text = out
                }
            }
        }
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '2000', '-Xmaxwarns', '2000']
}

// TEMP (Phase 2.2): the gametest API churned heavily across 1.21.2→1.21.8 (mostly mechanical).
// Defer gametests on forward nodes while we seam the structural core; the 1.21.1 base keeps them.
// Remove once the gametest seams land.
if (stonecutter.current.project != '1.21.1') {
    tasks.named('compileJava', JavaCompile) { exclude '**/gametest/**' }
}
