name: Deploy Site

# Builds the Astro site in site/ and publishes it to GitHub Pages. The 3D
# Blueprint Viewer lives at /viewer (static, served verbatim from site/public);
# the curated blueprints + gallery manifest are injected at deploy time so the
# repo never stores generated copies.
#
# Runs ONLY on push to main (i.e. after a merge), never on a PR, so a fork PR can
# never trigger a deploy or touch the live site.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/main/resources/data/mc3dprint/blueprints/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish (don't cancel a live deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/configure-pages@v5

      - name: Install & build the Astro site
        working-directory: site
        run: |
          npm ci || npm install
          npm run build
          # dist/ now has all pages + /viewer (js/css/data/index.html) + CNAME + .nojekyll

      - name: Inject curated blueprints + gallery manifest into /viewer
        run: |
          mkdir -p site/dist/viewer/blueprints
          cp src/main/resources/data/mc3dprint/blueprints/*.blueprint site/dist/viewer/blueprints/
          node site/scripts/gen_manifest.mjs \
            src/main/resources/data/mc3dprint/blueprints \
            site/dist/viewer/manifest.json \
            blueprints/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
