name: CI

# Build gate for pull requests. Before this existed the only pull_request workflow was
# blueprint-preview.yml, a preview renderer, so nothing verified that a PR compiled.
#
# The node matrix is the point, not thoroughness for its own sake: the JUnit suite is meant
# to pass on EVERY Stonecutter node, and a forward node that cannot compile src/test is a
# real failure. That silently went unnoticed once already, because node tasks are scoped and
# a local run at the active node proves nothing about the others.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  junit:
    name: JUnit ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every shippable NeoForge node. Trim this list if PR latency becomes a problem;
        # keep 1.21.1 (the active node) and 26.2 (the newest) at minimum, since those two
        # bracket the guard ranges where an API move is most likely to break a build.
        node: ["1.21.1", "1.21.8", "1.21.9", "1.21.10", "1.21.11", "26.1", "26.2"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Launcher JVM is Java 21. The 26.x nodes compile against a Java 25 toolchain that
      # Gradle provisions itself through the foojay resolver wired in settings.gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: chmod +x ./gradlew
      - run: ./gradlew :${{ matrix.node }}:test --no-daemon

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/reports/tests/test
          retention-days: 7

  gametest:
    name: GameTest oracle 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: chmod +x ./gradlew
      - run: ./gradlew :1.21.1:runGameTestServer --no-daemon

      # A green exit code does NOT mean the tests ran. runGameTestServer exits 0 having run
      # nothing when the server dies at startup (a held world lock) or when Gradle marks the
      # task UP-TO-DATE. The only proof of a real run is this line, so assert it explicitly.
      - name: Assert the oracle actually ran
        run: |
          log=versions/1.21.1/run/logs/latest.log
          if [ ! -f "$log" ]; then
            echo "::error::No server log at $log. The gametest server never started."
            exit 1
          fi
          count=$(grep -oE "All [0-9]+ required tests passed" "$log" | tail -1 | grep -oE "^All [0-9]+" | grep -oE "[0-9]+" || true)
          if [ -z "$count" ]; then
            echo "::error::Gradle succeeded but no test-pass line was logged. This is the false-green case."
            grep -iE "failed|error|lock" "$log" | tail -30
            exit 1
          fi
          # "All 0 required tests passed" is the documented shape of a registration failure:
          # with the gametest namespace unset, zero tests register and the run still exits 0.
          # A floor also catches a partial de-registration, which a nonzero check would miss.
          if [ "$count" -lt 150 ]; then
            echo "::error::Only $count gametests ran, expected at least 150. Tests failed to register."
            exit 1
          fi
          echo "All $count required tests passed"

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log
          path: versions/1.21.1/run/logs/latest.log
          retention-days: 7
