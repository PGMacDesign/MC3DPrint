name: Build & attach all mod jars to release

# Runs when you publish a GitHub Release. Builds every shippable jar via
# scripts/build-all.sh (NeoForge 1.21.1/1.21.8/1.21.9/1.21.10/1.21.11/26.1/26.2 from
# this tree's Stonecutter nodes, Forge 1.20.1 from the legacy/1.20.1 branch) and
# attaches them all to that release.
on:
  release:
    types: [published]

# Required so the workflow can upload jars as release assets.
permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    # Surface the secret as a job env var so the CurseForge steps can guard on it —
    # the `secrets` context is NOT available in step `if:` conditions, but `env` is.
    env:
      CF_TOKEN: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout (full history — the Forge build needs the legacy/1.20.1 branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Strip a leading "v" so tag v0.11.0 -> 0.11.0. Fed to Gradle so the jars (and
      # their in-jar metadata) match the release tag without bumping gradle.properties.
      - name: Derive version from release tag
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      # Both JDKs in the same job: NeoForge nodes need a Java 21 launcher (Stonecutter),
      # the legacy Forge build needs Java 17. setup-java exports JAVA_HOME_<major>_X64 for
      # each, which build-all.sh auto-detects. (The last call also sets the default JAVA_HOME.)
      # The 26.x nodes additionally COMPILE with a Java 25 toolchain — Gradle's foojay
      # resolver (wired in settings.gradle) downloads that JDK on demand, so no setup here.
      - name: Set up JDK 17 (Forge 1.20.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up JDK 21 (NeoForge 1.21.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build all jars
        run: |
          chmod +x ./scripts/build-all.sh ./gradlew
          ./scripts/build-all.sh --version "${{ steps.ver.outputs.version }}"

      - name: Show built artifacts
        run: ls -la dist/

      # Attach every jar + style resource-pack zip to the release that triggered this
      # run. --clobber lets a re-run replace assets instead of failing.
      - name: Attach jars and style packs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.jar dist/*.zip --clobber

      # CurseForge: publish only the soak-tested targets. 1.20.1 (Forge) and 1.21.1
      # (NeoForge) ship; the forward jars (1.21.8 through 26.2) are attached to the
      # GitHub release but NOT auto-published to CurseForge until each passes its
      # in-world soak — promote one by adding a step mirroring these (loaders:
      # neoforge, game-versions: <mc>, java: 21 or 25 for 26.x) when it's ready.
      - name: Publish 1.20.1 (Forge) to CurseForge
        if: ${{ env.CF_TOKEN != '' }}
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1587177
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          files: dist/mc3dprint-*-forge-1.20.1.jar
          name: ${{ github.event.release.name }}
          version: ${{ steps.ver.outputs.version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          game-versions: 1.20.1
          loaders: forge
          java: 17

      - name: Publish 1.21.1 (NeoForge) to CurseForge
        if: ${{ env.CF_TOKEN != '' }}
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1587177
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          files: dist/mc3dprint-*-neoforge-1.21.1.jar
          name: ${{ github.event.release.name }}
          version: ${{ steps.ver.outputs.version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          game-versions: 1.21.1
          loaders: neoforge
          java: 21
