name: Build & attach mod jar to release

# Runs when you publish a GitHub Release. Builds the production (reobfuscated) jar —
# the same one you'd drop into a modpack — and attaches it to that release.
on:
  release:
    types: [published]

# Required so the workflow can upload the jar as a release asset.
permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strip a leading "v" so tag v0.4.0 -> 0.4.0. This version is fed to Gradle so the
      # jar (and the in-jar mod metadata) match the release tag without bumping
      # gradle.properties first.
      - name: Derive version from release tag
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17 (Forge 1.20.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build mod jar
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmod_version="${{ steps.ver.outputs.version }}" --no-daemon --stacktrace

      - name: Show built artifacts
        run: ls -la build/libs/

      # Upload to the release that triggered this run. Only one mc3dprint-*.jar is produced
      # (no sources/dev jar), so the glob is the single production jar. --clobber lets a
      # re-run replace the asset instead of failing.
      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/mc3dprint-*.jar --clobber

      # Also upload the same jar to CurseForge. Guarded on the secret so releases keep
      # working (and the GitHub asset still attaches) until the CURSEFORGE_TOKEN is set.
      # Prereleases publish as "Beta" on CurseForge; the changelog is the release body.
      - name: Publish jar to CurseForge
        if: ${{ secrets.CURSEFORGE_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1587177
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/mc3dprint-*.jar
          name: ${{ github.event.release.name }}
          version: ${{ steps.ver.outputs.version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          game-versions: 1.20.1
          loaders: forge
          java: 17
